apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: adservice
spec:
  selector:
    matchLabels:
      app: adservice
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/boutique-prod/sa/frontend
      to:
        - operation:
            ports: ["9555"]
---
